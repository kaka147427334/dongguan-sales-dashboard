<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D系订单门店排行榜 - 9月22日</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
}
.container {
    max-width: 760px;
    width: 100%;
}
.header {
    text-align: center;
    margin-bottom: 30px;
}
.header h1 {
    font-size: 28px;
    color: #fff;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.header .date {
    font-size: 15px;
    color: #8899aa;
    margin-top: 8px;
}
.header .total {
    font-size: 14px;
    color: #4fc3f7;
    margin-top: 6px;
}
.podium {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 12px;
    margin-bottom: 28px;
    padding: 0 10px;
    flex-wrap: wrap;
}
.podium-item {
    flex: 1;
    min-width: 140px;
    max-width: 220px;
    border-radius: 14px 14px 8px 8px;
    padding: 18px 14px 16px;
    text-align: center;
    position: relative;
    transition: transform 0.3s;
}
.podium-item:hover { transform: translateY(-4px); }
.podium-item .rank-icon {
    font-size: 32px;
    line-height: 1;
    margin-bottom: 6px;
}
.podium-item .rank-label {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
    opacity: 0.9;
}
.podium-item .store-name {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 10px;
    line-height: 1.3;
}
.podium-item .grand-total {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    line-height: 1;
    margin-bottom: 8px;
}
.podium-item .grand-total .d-unit {
    font-size: 14px;
    color: #fff;
    opacity: 0.7;
    margin-left: 2px;
}
.podium-item .month-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 4px;
}
.podium-item .month-cell {
    text-align: center;
}
.podium-item .month-label {
    font-size: 10px;
    color: #fff;
    opacity: 0.6;
    margin-bottom: 2px;
}
.podium-item .month-val {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    opacity: 0.85;
}
.podium-item .d-breakdown {
    font-size: 10px;
    color: #fff;
    opacity: 0.5;
    margin-top: 6px;
}
.podium-1 { background: linear-gradient(180deg, #FFD700 0%, #DAA520 100%); min-height: 200px; }
.podium-2 { background: linear-gradient(180deg, #C0C0C0 0%, #8a8a8a 100%); min-height: 180px; }
.podium-3 { background: linear-gradient(180deg, #CD7F32 0%, #8B4513 100%); min-height: 165px; }

.rest-table {
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(10px);
}
.rest-table .rest-title {
    font-size: 13px;
    color: #667788;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.rest-table table {
    width: 100%;
    border-collapse: collapse;
}
.rest-table th {
    font-size: 12px;
    color: #667788;
    font-weight: 600;
    padding: 6px 4px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}
.rest-table th.col-name { text-align: left; padding-left: 8px; }
.rest-table td {
    padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    text-align: center;
}
.rest-table tr:last-child td { border-bottom: none; }
.rest-table td.col-rank {
    font-size: 13px;
    color: #556677;
    font-weight: 600;
    width: 40px;
}
.rest-table td.col-name {
    font-size: 14px;
    color: #aabbcc;
    text-align: left;
    padding-left: 8px;
}
.rest-table td.col-num {
    font-size: 15px;
    color: #8899aa;
    font-weight: 600;
}
.rest-table td.col-total {
    font-size: 16px;
    color: #4fc3f7;
    font-weight: 700;
}
.rest-table td.col-breakdown {
    font-size: 11px;
    color: #556677;
}
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #445566;
}
</style>
</head>
<body>
<div class="container">

    <div class="rest-table">

        <table>

            <tbody>

                <tr>

                <tr>

                </tr>
                <tr>
                    <td class="col-rank">9</td>
                    <td class="col-name">大岭山镇店</td>

                </tr>
            </tbody>
        </table>
    </div>
    <div class="footer">D系 = D19系列 + D99系列 · 9月数据截止9月22日 · 当月单月口径 · 相同数量并列排名</div>
</div>
</body>
</html>
